# curto with Docker Compose.
#
#   CURTO_API_KEY="$(openssl rand -base64 32)" docker compose up -d --build
#
# The dashboard and the API listen on http://127.0.0.1:8080 (loopback only). To publish the service, put a reverse
# proxy with TLS in front of it and set CURTO_BASE_URL to the public origin: see docs/reverse-proxy.md.
services:
  curto:
    build: .
    image: curto:latest
    container_name: curto
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CURTO_API_KEY: "${CURTO_API_KEY:?Set CURTO_API_KEY first, for example with openssl rand -base64 32}"
      CURTO_BASE_URL: "${CURTO_BASE_URL:-}"
      CURTO_DB_PATH: /data/curto.db
    volumes:
      - curto-data:/data
    # Hardening: nothing but /data and /tmp is writable, and the process has no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image already defines a HEALTHCHECK (Curto.Api --healthcheck); these values only tune it.
    healthcheck:
      test: ["CMD", "./Curto.Api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  curto-data:
